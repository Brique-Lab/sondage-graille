:root{
  --ink:#20423C;
  --paper:#FFFFFF;
  --lawn:#63791B;
  --pool:#337AB4;
  --pink:#F1A3B6;
  --sun:#F4C026;
  --display:"Flared","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:var(--pink);--fg:var(--ink);--soft:rgba(32,66,60,.86);--btn-bg:var(--ink);--btn-fg:#FFFFFF;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.5;transition:background-color .45s ease;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.photo{position:relative;overflow:hidden;aspect-ratio:16/10;max-height:42vh;width:100%;background:var(--bg)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,72% 50%);transition:opacity .35s ease}
.photo::before{content:"";position:absolute;inset:0 0 auto 0;height:72px;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0));z-index:1}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(rgba(0,0,0,0),var(--bg));z-index:1;transition:background .45s ease}
.top{position:absolute;inset:0 0 auto 0;z-index:2;display:grid;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bar{height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:#FFFFFF;transition:width .35s ease}
.panel{display:flex;flex-direction:column;padding-block:8px calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;animation:rise .3s ease-out}
@keyframes rise{from{opacity:.5;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(30px,8.6vw,50px);line-height:1.03;margin:0;text-wrap:balance;color:var(--fg)}
h1:focus{outline:none}
.lede{margin:0;color:var(--soft);font-size:15px;max-width:44ch;text-wrap:pretty}
.lede strong{color:var(--fg)}
.choices{display:grid;gap:10px}
.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:16px 18px;text-align:left;
  background:var(--paper);color:var(--ink);border:0;border-radius:16px;font:inherit;font-size:15.5px;font-weight:700;line-height:1.3;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.08);transition:transform .15s ease,background-color .15s,color .15s}
.choice svg{flex:none;width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.choice:hover{transform:translateY(-2px)}
.choice:hover svg{transform:translateX(3px)}
.choice[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:122px;padding:14px;text-align:left;
  background:var(--paper);color:var(--ink);border:0;border-radius:16px;font:inherit;font-size:14px;font-weight:700;line-height:1.3;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.08);transition:transform .15s ease,background-color .15s,color .15s}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;justify-content:flex-start}
.tile:hover{transform:translateY(-2px)}
.tile .ico{width:34px;height:34px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile .tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--pink);display:grid;place-items:center;transform:scale(0);transition:transform .18s ease}
.tile .tick svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2.6;fill:none}
.tile[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.tile[aria-pressed="true"] .tick{transform:scale(1)}
.field{display:grid;gap:6px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:16px;padding:15px 16px}
textarea{min-height:140px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--soft);margin:0}
.error{font-size:13px;color:var(--ink);background:var(--paper);border-radius:10px;padding:8px 12px;margin:0}
.legal{font-size:12px;color:var(--soft);margin:0;max-width:52ch}
.nav{display:flex;align-items:center;gap:16px;padding-top:6px}
.back{background:none;border:0;padding:10px 0;font:inherit;font-size:13px;color:var(--fg);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.go{margin-left:auto;min-height:56px;padding:0 26px;background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:999px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .15s ease,opacity .2s}
.go:hover:not(:disabled){transform:translateY(-2px)}
.go:disabled{opacity:.4;cursor:default;box-shadow:none}
.recap{width:100%;min-height:210px;font:inherit;font-size:13px;line-height:1.6;background:var(--paper);color:var(--ink);border:0;border-radius:16px;padding:16px;resize:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#FFFFFF;padding:12px 18px;font-size:13px;border-radius:999px;z-index:5}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:359px){.tiles{grid-template-columns:1fr}.tile{min-height:88px}}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:none;height:100%}
  .photo{aspect-ratio:auto;max-height:none;height:100%;position:sticky;top:0}
  .photo::after{inset:0 0 0 auto;width:22%;height:auto;background:linear-gradient(90deg,rgba(0,0,0,0),var(--bg))}
  .top{padding:24px 28px}
  .panel{overflow:auto;justify-content:center;padding:48px 48px 40px}
  h1{font-size:clamp(32px,3.3vw,52px)}
}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}
</style>

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const restoName = () => RESTO.name || ((answers.name && answers.name.text) || "").trim();

function toolName() {
  const a = answers.tool;
  if (!a) return "";
  if (RESTO.tool && a.value === RESTO.tool) return RESTO.tool;
  const o = answers.tool_other;
  if (!o || !(a.value === "Autre outil" || a.value === "Outil en ligne")) return "";
  return o.value === "Autre" ? (o.other || "").trim() : o.value;
}

function go(next) { history.push(current); current = next; render(); }
function back() { if (history.length && sendState !== "sent") { current = history.pop(); render(); } }

function applyLook(name) {
  const l = LOOKS[name], root = document.documentElement.style;
  root.setProperty("--bg", l.bg); root.setProperty("--fg", l.fg); root.setProperty("--soft", l.soft);
  root.setProperty("--btn-bg", l.btnBg); root.setProperty("--btn-fg", l.btnFg); root.setProperty("--pos", l.pos);
  const img = $("#photo");
  if (!img.getAttribute("src").endsWith(l.img)) {
    if (reduceMotion()) { img.setAttribute("src", l.img); return; }
    img.style.opacity = "0";
    setTimeout(() => { img.onload = () => (img.style.opacity = "1"); img.setAttribute("src", l.img); }, 160);
  }
}

function progress() {
  const i = ORDER.indexOf(current);
  const p = current === "intro" ? 0.04 : current === "end" ? 1 : (i + 1) / (ORDER.length + 1);
  $("#bar").style.width = Math.round(p * 100) + "%";
}

function head(s) {
  return `${s.eyebrow ? `<div class="eyebrow">${esc(s.eyebrow)}</div>` : ""}
    <h1 id="q-title" tabindex="-1">${esc(val(s.title)).replace(/ ([?!:])$/, "&nbsp;$1")}</h1>
    ${s.lede ? `<p class="lede">${esc(val(s.lede))}</p>` : ""}`;
}
function nav(label, disabled, id = "next") {
  return `<div class="nav">${history.length ? `<button class="back" id="back" type="button">Retour</button>` : ""}
    ${label ? `<button class="go" id="${id}" type="button" ${disabled ? "disabled" : ""}>${esc(label)}</button>` : ""}</div>`;
}

function render() {
  const s = SCREENS[current];
  applyLook(s.look);
  progress();
  const html = { intro: renderIntro, name: renderName, single: renderSingle, multi: renderMulti, text: renderText, contact: renderContact, end: renderEnd }[s.kind](s);
  $("#main").innerHTML = html;
  wire(s);
  const t = $("#q-title"); if (t) t.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  const panel = $(".panel"); if (panel) panel.scrollTop = 0;
}

function renderIntro() {
  return `<section class="screen">
    <div class="eyebrow">${RESTO.name ? `Pour l'équipe de ${esc(RESTO.name)}` : "Pour les restaurants de Toulouse"}</div>
    <h1 id="q-title" tabindex="-1">Sur la carte de Graille Club</h1>
    <p class="lede">Graille Club, c'est la carte des meilleures adresses de Toulouse : plus de 400 restaurants testés, et une communauté de 11 000 personnes sur Instagram.</p>
    <p class="lede">On prépare une offre pour y installer votre restaurant. Avec la réservation, des photos de vos plats, votre menu du jour en ligne et des passages dans les stories.</p>
    <p class="lede"><strong>Avant de la construire, on aimerait savoir comment vous faites aujourd'hui.</strong> Il n'y a presque rien à écrire.</p>
    ${nav("Je réponds", false)}
  </section>`;
}

function renderName(s) {
  const a = answers.name;
  return `<section class="screen">${head(s)}
    <div class="field"><label for="text" class="sr">Nom du restaurant</label><input type="text" id="text" autocomplete="organization" value="${esc((a && a.text) || "")}"></div>
    ${nav("Continuer", !canContinue(s))}
  </section>`;
}

function renderSingle(s) {
  const a = answers[current];
  const opts = s.options.map((o, i) => `<button class="choice" type="button" data-i="${i}" aria-pressed="${!!(a && a.index === i)}"><span>${esc(val(o.label))}</span>${CHEVRON}</button>`).join("");
  const otherOpt = s.options.find((o) => o.other);
  const showOther = a && s.options[a.index] && s.options[a.index].other;
  return `<section class="screen">${head(s)}
    <div class="choices" role="group" aria-labelledby="q-title">${opts}</div>
    ${otherOpt ? `<div class="field" id="other-wrap" ${showOther ? "" : "hidden"}><label for="other">${esc(otherOpt.other)}</label><input type="text" id="other" autocomplete="off" value="${esc((a && a.other) || "")}"></div>` : ""}
    ${nav(showOther || a ? "Continuer" : "", !canContinue(s))}
  </section>`;
}

function renderMulti(s) {
  const a = answers[current] || { picked: [], other: "" };
  const tiles = s.options.map((o, i) => `<button class="tile${o.wide ? " wide" : ""}" type="button" data-i="${i}" aria-pressed="${a.picked.includes(i)}">${SVG(ICONS[o.icon])}<span>${esc(o.label)}</span>${TICK}</button>`).join("");
  const oi = s.options.findIndex((o) => o.other);
  return `<section class="screen">${head(s)}
    <div class="tiles" role="group" aria-labelledby="q-title">${tiles}</div>
    ${oi >= 0 ? `<div class="field" id="other-wrap" ${a.picked.includes(oi) ? "" : "hidden"}><label for="other">${esc(s.options[oi].other)}</label><input type="text" id="other" autocomplete="off" value="${esc(a.other || "")}"></div>` : ""}
    ${nav("Continuer", !canContinue(s))}
  </section>`;
}

function renderText(s) {
  const a = answers[current];
  return `<section class="screen">${head(s)}
    <div class="field"><label for="text" class="sr">Votre réponse</label><textarea id="text" placeholder="Votre réponse">${esc((a && a.text) || "")}</textarea></div>
    <p class="hint">${esc(s.hint)}</p>
    ${nav("Continuer", !canContinue(s))}
  </section>`;
}

function renderContact(s) {
  const a = answers.contact || { who: "", reach: "" };
  return `<section class="screen">${head(s)}
    <div class="field"><label for="who">Votre prénom et votre rôle</label><input type="text" id="who" autocomplete="name" placeholder="Julie, gérante" value="${esc(a.who)}"></div>
    <div class="field"><label for="reach">Téléphone ou e-mail</label><input type="text" id="reach" autocomplete="email" inputmode="email" value="${esc(a.reach)}"></div>
    <p class="error" id="reach-error" hidden>Il manque un numéro de téléphone ou un e-mail complet.</p>
    <p class="legal">Ces coordonnées servent seulement à vous recontacter sur ce projet. On ne les transmet à personne et on les supprime à la fin, ou avant si vous le demandez à la personne qui vous a envoyé ce lien.</p>
    ${nav("Terminer", !canContinue(s))}
  </section>`;
}

function renderEnd() {
  const name = restoName();
  if (sendState === "sending") {
    return `<section class="screen"><div class="eyebrow">Envoi en cours</div><h1 id="q-title" tabindex="-1">Un instant</h1></section>`;
  }
  if (sendState === "sent") {
    const more = answers.more && answers.more.value === "Oui";
    return `<section class="screen">
      <div class="eyebrow">C'est envoyé</div>
      <h1 id="q-title" tabindex="-1">Merci${name ? " " + esc(name) : ""}</h1>
      <p class="lede">Vos réponses sont parties. ${more ? "On revient vers vous pour en parler." : "Elles nous aident à construire quelque chose qui vous serve vraiment."}</p>
    </section>`;
  }
  return `<section class="screen">
    <div class="eyebrow">Dernière étape</div>
    <h1 id="q-title" tabindex="-1">Merci${name ? " " + esc(name) : ""}</h1>
    <p class="lede">L'envoi automatique n'a pas marché. Copiez vos réponses et collez-les dans votre conversation avec la personne qui vous a envoyé ce lien.</p>
    <label for="recap" class="sr">Vos réponses</label>
    <textarea class="recap" id="recap" readonly>${esc(recap())}</textarea>
    ${nav("Copier mes réponses", false, "copy")}
  </section>`;
}

function canContinue(s) {
  const a = answers[current];
  if (s.kind === "single") {
    if (!a) return false;
    const o = s.options[a.index];
    return !(o && o.other) || !!(a.other && a.other.trim());
  }
  if (s.kind === "multi") {
    if (!a || !a.picked.length) return false;
    const oi = s.options.findIndex((o) => o.other);
    return !(oi >= 0 && a.picked.includes(oi)) || !!(a.other && a.other.trim());
  }
  if (s.kind === "text" || s.kind === "name") return !!(a && a.text && a.text.trim());
  if (s.kind === "contact") return !!(a && a.who.trim() && reachOk(a.reach));
  return true;
}
function reachOk(v) { v = (v || "").trim(); return /\S+@\S+\.\S+/.test(v) || v.replace(/\D/g, "").length >= 9; }
function refreshNext(s) { const n = $("#next"); if (n) n.disabled = !canContinue(s); }
function nextOf(s) {
  const a = answers[current];
  if (s.kind === "single" && a) { const o = s.options[a.index]; return (o && o.next) || s.next; }
  return s.next;
}

function wire(s) {
  const b = $("#back"); if (b) b.addEventListener("click", back);
  if (s.kind === "intro") { $("#next").addEventListener("click", () => go(RESTO.name ? "tool" : "name")); return; }
  if (s.kind === "end") { const c = $("#copy"); if (c) c.addEventListener("click", copyRecap); return; }

  if (s.kind === "single") {
    document.querySelectorAll(".choice").forEach((el) => el.addEventListener("click", () => {
      const i = +el.dataset.i, o = s.options[i], prev = answers[current];
      answers[current] = { index: i, value: val(o.value), other: prev && prev.index === i ? prev.other : "" };
      document.querySelectorAll(".choice").forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.i === i)));
      if (o.other) { render(); const inp = $("#other"); if (inp) inp.focus(); return; }
      const w = $("#other-wrap"); if (w) w.hidden = true;
      setTimeout(() => { if (SCREENS[current] === s) advance(s); }, reduceMotion() ? 0 : 240);
    }));
  }
  if (s.kind === "multi") {
    document.querySelectorAll(".tile").forEach((el) => el.addEventListener("click", () => {
      const i = +el.dataset.i, a = answers[current] || { picked: [], other: "" };
      a.picked = a.picked.includes(i) ? a.picked.filter((x) => x !== i) : [...a.picked, i].sort((x, y) => x - y);
      answers[current] = a;
      el.setAttribute("aria-pressed", String(a.picked.includes(i)));
      const w = $("#other-wrap");
      if (w && s.options[i].other) { w.hidden = !a.picked.includes(i); if (!w.hidden) $("#other").focus(); }
      refreshNext(s);
    }));
  }
  const other = $("#other");
  if (other) other.addEventListener("input", () => { if (answers[current]) answers[current].other = other.value; refreshNext(s); });
  if (s.kind === "text" || s.kind === "name") {
    const t = $("#text");
    t.addEventListener("input", () => { answers[current] = { text: t.value }; refreshNext(s); });
    if (s.kind === "name") t.addEventListener("keydown", (e) => { if (e.key === "Enter" && canContinue(s)) advance(s); });
  }
  if (s.kind === "contact") {
    const who = $("#who"), reach = $("#reach");
    const upd = () => { answers.contact = { who: who.value, reach: reach.value }; refreshNext(s); };
    who.addEventListener("input", upd); reach.addEventListener("input", upd);
    reach.addEventListener("blur", () => { $("#reach-error").hidden = !reach.value.trim() || reachOk(reach.value); });
  }
  const n = $("#next");
  if (n) n.addEventListener("click", () => { if (canContinue(s)) advance(s); });
}

function advance(s) {
  const next = nextOf(s);
  go(next);
  if (next === "end") send();
}

function path() { return [...history, current].filter((id) => id !== "intro" && id !== "end"); }
function describe(id) {
  const s = SCREENS[id], a = answers[id];
  if (!a) return "";
  if (s.kind === "single") { const o = s.options[a.index]; return o && o.other ? (a.other || "").trim() : a.value; }
  if (s.kind === "multi") return a.picked.map((i) => (s.options[i].other ? `Autre : ${(a.other || "").trim()}` : s.options[i].label)).join(" ; ");
  if (s.kind === "text") return a.text.trim();
  return "";
}
// Une ligne du Google Sheet ; les colonnes restent dans cet ordre même quand une question n'a pas été posée.
function payload() {
  const p = path(), on = (id) => p.includes(id);
  const c = answers.contact || { who: "", reach: "" };
  return {
    "Restaurant": restoName(),
    "Outil indiqué dans le lien": RESTO.rawTool || "",
    "Réservations": on("tool") ? describe("tool") : "",
    "Outil": toolName(),
    "Coût par mois": on("budget") ? describe("budget") : "",
    "S'en sert pour": on("uses") ? describe("uses") : "",
    "Content de l'outil": on("happy") ? describe("happy") : "",
    "Ce qui coince": on("missing") ? describe("missing") : "",
    "Intéressé par": on("offer") ? describe("offer") : "",
    "Veut en parler": on("more") ? describe("more") : "",
    "Prénom et rôle": on("contact") ? c.who.trim() : "",
    "Contact": on("contact") ? c.reach.trim() : ""
  };
}
function recap() {
  return Object.entries(payload()).filter(([, v]) => v).map(([k, v]) => `${k} : ${v}`).join("\n");
}

async function send() {
  if (!SHEET_URL || SHEET_URL.startsWith("__")) { sendState = "failed"; render(); return; }
  sendState = "sending"; render();
  try {
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload()) });
    sendState = "sent";
  } catch (e) { sendState = "failed"; }
  render();
}

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200); }
function copyRecap() {
  const area = $("#recap"), text = area.value;
  const fallback = () => { area.focus(); area.select(); toast("Texte sélectionné : copiez-le avec le menu de votre téléphone."); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Copié. Il ne reste qu'à le coller."), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

function start(data) {
  if (data && data.current && SCREENS[data.current]) { answers = data.answers || {}; history = data.history || []; current = data.current; sendState = data.sendState || "idle"; }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ answers, history, current, sendState })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
